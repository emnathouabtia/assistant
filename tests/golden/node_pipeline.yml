trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: build_and_test
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: |
              npm install
              npm test
            displayName: Install and test
          - publish: $(System.DefaultWorkingDirectory)
            artifact: drop

  - stage: Deploy
    dependsOn: Build
    jobs:
      - deployment: deploy_web
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'sc-azure'
                    appType: webAppLinux
                    appName: 'demo-app-x7k2'
                    package: $(Pipeline.Workspace)/drop